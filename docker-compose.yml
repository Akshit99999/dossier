services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dossier}
      MYSQL_USER: ${MYSQL_USER:-dossier}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dossier_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dossier_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dossier_mysql_data:
