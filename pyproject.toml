[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier-agent"
version = "0.1.0"
description = "A live-source research and fact-checking agent"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Akshit Sharma", email = "akshitsharma684@gmail.com" }]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dossier = "dossier_agent.cli:main"
dossier-web = "dossier_agent.server:main"

[tool.setuptools.packages.find]
include = ["dossier_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
